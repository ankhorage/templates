name: ZORA 19 template codemod

on:
  push:
    branches:
      - chore/zora-19-rollout

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/zora-19-rollout
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Migrate removed ZORA layout node names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = (
              Path('src/templates/categories/social-community/chat/createAppManifest.ts'),
              Path('src/templates/categories/lifestyle/stillpath/createAppManifest.ts'),
              Path('src/templates/categories/education-learning/sharkprey/createAppManifest.ts'),
              Path('test/runtime-assets.test.ts'),
          )
          replacements = (
              ("type: 'Box'", "type: 'View'"),
              ("type: 'Stack'", "type: 'View'"),
              ("type: 'SettingsRow'", "type: 'ListItem'"),
          )

          changed = []
          for path in paths:
              before = path.read_text()
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              if after != before:
                  path.write_text(after)
                  changed.append(str(path))

          if not changed:
              raise SystemExit('Expected legacy ZORA node names were not found.')

          print('\n'.join(changed))
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Remove temporary codemod workflow
        run: rm .github/workflows/zora-19-template-codemod.yml
      - name: Commit migrated manifests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/templates/categories/social-community/chat/createAppManifest.ts \
            src/templates/categories/lifestyle/stillpath/createAppManifest.ts \
            src/templates/categories/education-learning/sharkprey/createAppManifest.ts \
            test/runtime-assets.test.ts \
            .github/workflows/zora-19-template-codemod.yml
          git commit -m "refactor: migrate templates to ZORA 19 layout nodes"
          git push origin HEAD:chore/zora-19-rollout
