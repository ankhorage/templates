name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and commit Stillpath source
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          bun run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/categories/lifestyle/stillpath/createAppManifest.ts
          git commit -m "style: format Stillpath template"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Stop diagnostic run
        run: exit 1
