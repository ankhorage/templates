name: Apply theme mode template defaults

on:
  push:
    branches:
      - theme-mode-toggle-defaults

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theme-mode-toggle-defaults
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply template-owned theme mode default
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'package.json',
              '"@ankhorage/zora": "^2.9.0"',
              '"@ankhorage/zora": "^2.11.0"',
          )

          replace_once(
              'src/internal/zora-nodes.ts',
              "import type { SectionHeaderProps, SettingsRowProps } from '@ankhorage/zora';",
              "import type {\n  SectionHeaderProps,\n  SettingsRowProps,\n  ThemeModeToggleProps,\n} from '@ankhorage/zora';",
          )
          replace_once(
              'src/internal/zora-nodes.ts',
              "type SerializableSettingsRowProps = Omit<\n  SettingsRowProps,\n  'control' | 'description' | 'meta' | 'onPress' | 'title'\n> & {\n  title: string;\n  description?: string;\n  meta?: string;\n};",
              "type SerializableSettingsRowProps = Omit<\n  SettingsRowProps,\n  'control' | 'description' | 'meta' | 'onPress' | 'title'\n> & {\n  title: string;\n  description?: string;\n  meta?: string;\n};\ntype SerializableThemeModeToggleProps = Pick<\n  ThemeModeToggleProps,\n  'disabled' | 'size' | 'testID'\n>;",
          )
          replace_once(
              'src/internal/zora-nodes.ts',
              "  SettingsRow: SerializableSettingsRowProps;\n}",
              "  SettingsRow: SerializableSettingsRowProps;\n  ThemeModeToggle: SerializableThemeModeToggleProps;\n}",
          )

          replace_once(
              'src/templates/shared/zora-node-helpers.ts',
              "      ...rows.map((row) =>\n        createZoraNode(`${idPrefix}-${row.id}`, 'SettingsRow', {\n          title: row.title,\n          description: row.description,\n          ...(row.meta ? { meta: row.meta } : {}),\n        }),\n      ),\n    ],",
              "      ...rows.map((row) =>\n        createZoraNode(`${idPrefix}-${row.id}`, 'SettingsRow', {\n          title: row.title,\n          description: row.description,\n          ...(row.meta ? { meta: row.meta } : {}),\n        }),\n      ),\n      createZoraNode(`${idPrefix}-appearance-header`, 'SectionHeader', {\n        title: 'Appearance',\n        description: 'Switch between light and dark appearance.',\n      }),\n      createZoraNode(`${idPrefix}-theme-mode-toggle`, 'ThemeModeToggle', {\n        size: 'm',\n        testID: `${idPrefix}-theme-mode-toggle`,\n      }),\n    ],",
          )

          replace_once(
              'src/templates/starter/categories/fallback/screens.ts',
              "            createZoraNode(`${idPrefix}-settings-row-deploy`, 'SettingsRow', {\n              title: 'Deployment target',\n              description: 'The starter ships with a local minikube deployment target.',\n              meta: 'minikube',\n            }),\n          ],",
              "            createZoraNode(`${idPrefix}-settings-row-deploy`, 'SettingsRow', {\n              title: 'Deployment target',\n              description: 'The starter ships with a local minikube deployment target.',\n              meta: 'minikube',\n            }),\n            createZoraNode(`${idPrefix}-settings-appearance-header`, 'SectionHeader', {\n              title: 'Appearance',\n              description: 'Switch between light and dark appearance.',\n            }),\n            createZoraNode(`${idPrefix}-settings-theme-mode-toggle`, 'ThemeModeToggle', {\n              size: 'm',\n              testID: `${idPrefix}-settings-theme-mode-toggle`,\n            }),\n          ],",
          )

          marker = "  test('builds a dedicated template for known AppCategory values', () => {"
          test_file = Path('test/create-category-app.test.ts')
          test_text = test_file.read_text()
          if marker not in test_text:
              raise SystemExit('category template test marker not found')
          new_test = """  test('keeps the theme mode switcher as template UI instead of a global requirement', () => {\n    const settingsManifest = createStarterTemplate(createSeed('developer_tools'));\n    const weatherManifest = createStarterTemplate(createSeed('weather'));\n    const settingsNodeTypes = Object.values(settingsManifest.screens).flatMap((screen) =>\n      collectNodeTypes(screen.root),\n    );\n    const weatherNodeTypes = Object.values(weatherManifest.screens).flatMap((screen) =>\n      collectNodeTypes(screen.root),\n    );\n\n    expect(settingsNodeTypes).toContain('ThemeModeToggle');\n    expect(weatherNodeTypes).not.toContain('ThemeModeToggle');\n  });\n\n"""
          test_file.write_text(test_text.replace(marker, new_test + marker, 1))

          changeset = Path('.changeset/theme-mode-template-defaults.md')
          changeset.write_text("""---\n'@ankhorage/templates': minor\n---\n\nAdd the authorable ZORA ThemeModeToggle as a starter Settings/Profile default while leaving templates without a settings surface unchanged.\n""")
          PY
      - name: Update lockfile
        run: bun install
      - name: Format
        run: bun run format
      - name: Validate
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
      - name: Commit product diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src test .changeset
          git commit -m "Add theme mode toggle template defaults"
      - name: Validate changeset
        run: bun run changeset:status
      - name: Push product diff
        run: git push origin HEAD:theme-mode-toggle-defaults
