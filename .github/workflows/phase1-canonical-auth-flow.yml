name: Complete Canonical Auth Flow Migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'phase1/canonical-auth-flow'
    runs-on: ubuntu-latest

    steps:
      - name: Clone migration branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch "$GITHUB_HEAD_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply canonical auth flow migration
        working-directory: repo
        run: python3 .github/phase1-migrate.py >/dev/null

      - name: Align canonical assertions
        working-directory: repo
        run: |
          python3 <<'PY'
          from pathlib import Path

          guard_file = Path('test/canonical-auth-flow-contract.test.ts')
          guard_content = guard_file.read_text()
          guard_old = r"expect(content, file).not.toMatch(new RegExp(`${removedKey}\s*:`));"
          guard_new = r"expect(content.replaceAll(/\s/g, ''), file).not.toContain(`${removedKey}:`);"
          if guard_content.count(guard_old) != 1:
              raise SystemExit('Expected canonical auth-flow guard assertion once.')
          guard_file.write_text(guard_content.replace(guard_old, guard_new))

          category_file = Path('test/create-category-app.test.ts')
          category_content = category_file.read_text()
          category_old = "        postSignInRoute: 'index',\n      });\n      expect(manifest.infra.auth?.authorization)"
          category_new = "        postSignInRoute: '/',\n      });\n      expect(manifest.infra.auth?.authorization)"
          if category_content.count(category_old) != 1:
              raise SystemExit('Expected shared category post-sign-in assertion once.')
          category_file.write_text(category_content.replace(category_old, category_new))
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile >/dev/null

      - name: Format migration
        working-directory: repo
        run: |
          bun x prettier --write \
            src/templates/starter/categories/food-drink/nutrition-catalog-scan/template.ts \
            src/templates/starter/categories/business-productivity/urban-water-monitor/template.ts \
            test/create-category-app.test.ts \
            test/oauth-auth-templates.test.ts \
            test/create-food-drink-nutrition-catalog-scan-template.test.ts \
            test/create-business-productivity-urban-water-monitor-template.test.ts \
            test/canonical-auth-flow-contract.test.ts \
            README.md \
            .changeset/canonical-auth-flow.md >/dev/null

      - name: Test first failure
        working-directory: repo
        run: |
          set +e
          bun test --bail > /tmp/templates-test.log 2>&1
          status=$?
          tail -n 12 /tmp/templates-test.log
          exit $status

      - name: Build
        working-directory: repo
        run: bun run build >/dev/null

      - name: Typecheck
        working-directory: repo
        run: bun run typecheck >/dev/null

      - name: Autofix lint
        working-directory: repo
        run: bun run lint:fix >/dev/null || true

      - name: Lint
        working-directory: repo
        run: bun run lint

      - name: Test full suite
        working-directory: repo
        run: bun run test

      - name: Format check
        working-directory: repo
        run: bun run format:check

      - name: Diff check
        working-directory: repo
        run: git diff --check

      - name: Commit validated migration
        working-directory: repo
        run: |
          rm .github/workflows/phase1-canonical-auth-flow.yml
          rm .github/workflows/diagnose-canonical-auth-flow.yml
          rm .github/phase1-migrate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: use canonical authentication flow contract"
          git push origin HEAD:${{ github.head_ref }}
