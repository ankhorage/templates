name: Complete Canonical Auth Flow Migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'phase1/canonical-auth-flow'
    runs-on: ubuntu-latest

    steps:
      - name: Clone migration branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch "$GITHUB_HEAD_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply canonical auth flow migration
        working-directory: repo
        run: python3 .github/phase1-migrate.py >/dev/null

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile >/dev/null

      - name: Format migration
        working-directory: repo
        run: |
          bun x prettier --write \
            src/templates/starter/categories/food-drink/nutrition-catalog-scan/template.ts \
            src/templates/starter/categories/business-productivity/urban-water-monitor/template.ts \
            test/create-category-app.test.ts \
            test/oauth-auth-templates.test.ts \
            test/create-food-drink-nutrition-catalog-scan-template.test.ts \
            test/create-business-productivity-urban-water-monitor-template.test.ts \
            test/canonical-auth-flow-contract.test.ts \
            README.md \
            .changeset/canonical-auth-flow.md >/dev/null

      - name: Build
        working-directory: repo
        run: bun run build >/dev/null

      - name: Typecheck
        working-directory: repo
        run: bun run typecheck >/dev/null

      - name: Autofix lint
        working-directory: repo
        run: bun run lint:fix >/dev/null || true

      - name: Lint
        working-directory: repo
        run: bun run lint

      - name: Test
        working-directory: repo
        run: bun run test

      - name: Format check
        working-directory: repo
        run: bun run format:check

      - name: Diff check
        working-directory: repo
        run: git diff --check

      - name: Commit validated migration
        working-directory: repo
        run: |
          rm .github/workflows/phase1-canonical-auth-flow.yml
          rm .github/workflows/diagnose-canonical-auth-flow.yml
          rm .github/phase1-migrate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: use canonical authentication flow contract"
          git push origin HEAD:${{ github.head_ref }}
