name: Temporary SharkPrey Image Acceptance

on:
  push:
    branches:
      - test/255-image-to-zora

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Install OCR probe dependencies
        run: bun add --dev sharp@0.35.4 tesseract.js@7.0.0
      - name: Prepare local English OCR data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr-eng
          mkdir -p /tmp/tessdata
          LANGDATA="$(find /usr/share -name eng.traineddata -print -quit)"
          test -n "$LANGDATA"
          gzip -c "$LANGDATA" > /tmp/tessdata/eng.traineddata.gz
      - name: Probe CTA crop OCR
        run: |
          cat > ocr-probe.ts <<'TS'
          import sharp from 'sharp';
          import { createWorker, OEM, PSM } from 'tesseract.js';

          const input = 'src/templates/categories/education-learning/sharkprey/assets/screens/02-onboarding.png';
          const region = { left: 67, top: 1608, width: 719, height: 129 };
          const variants = {
            raw: await sharp(input).extract(region).png().toBuffer(),
            upscaled: await sharp(input).extract(region).resize({ width: region.width * 2 }).png().toBuffer(),
            normalized: await sharp(input)
              .extract(region)
              .resize({ width: region.width * 2 })
              .grayscale()
              .normalize()
              .png()
              .toBuffer(),
            threshold: await sharp(input)
              .extract(region)
              .resize({ width: region.width * 2 })
              .grayscale()
              .normalize()
              .threshold(185)
              .negate()
              .png()
              .toBuffer(),
          };

          const worker = await createWorker('eng', OEM.LSTM_ONLY, { langPath: '/tmp/tessdata' });
          await worker.setParameters({ tessedit_pageseg_mode: PSM.SINGLE_LINE });
          try {
            const results: Record<string, unknown> = {};
            for (const [name, image] of Object.entries(variants)) {
              const result = await worker.recognize(image);
              results[name] = {
                text: result.data.text.trim(),
                confidence: result.data.confidence,
              };
            }
            console.log(JSON.stringify(results, null, 2));
          } finally {
            await worker.terminate();
          }
          TS
          bun ocr-probe.ts
