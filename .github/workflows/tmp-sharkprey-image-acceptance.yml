name: Temporary SharkPrey Image Acceptance

on:
  push:
    branches:
      - test/255-image-to-zora

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Install released recognition boundaries
        run: |
          bun add @ankhorage/zora@4.4.1
          bun add --dev @ankhorage/utility@0.5.1 sharp@0.35.4 @techstark/opencv-js@5.0.0-release.1 tesseract.js@7.0.0
      - name: Prepare local English OCR data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr-eng
          mkdir -p /tmp/tessdata
          LANGDATA="$(find /usr/share -name eng.traineddata -print -quit)"
          test -n "$LANGDATA"
          gzip -c "$LANGDATA" > /tmp/tessdata/eng.traineddata.gz
      - name: Analyze original SharkPrey onboarding screen with released owners
        run: |
          cat > direct-image-acceptance.ts <<'TS'
          import {
            analyzeScreenImageAsync,
            createTesseractScreenOcrAsync,
          } from '@ankhorage/utility/image';
          import { ZORA_COMPONENT_META } from '@ankhorage/zora/metadata';

          const components = Object.values(ZORA_COMPONENT_META).filter(
            (component): component is NonNullable<typeof component> => component !== undefined,
          );
          const unresolvedComponentName = components.find(
            (component) => component.manifestPolicy?.kind === 'unresolved-element',
          )?.name;
          const ocr = await createTesseractScreenOcrAsync({
            langPath: '/tmp/tessdata',
            language: 'eng',
          });

          try {
            const result = await analyzeScreenImageAsync(
              'src/templates/categories/education-learning/sharkprey/assets/screens/02-onboarding.png',
              {
                screen: { id: 'onboarding', name: 'Onboarding', title: 'Onboarding' },
                components,
                minConfidence: 0.42,
                ...(unresolvedComponentName ? { unresolvedComponentName } : {}),
                ocr,
              },
            );

            const componentCounts: Record<string, number> = {};
            const walkComponent = (node: typeof result.screen.root): void => {
              componentCounts[node.type] = (componentCounts[node.type] ?? 0) + 1;
              for (const child of node.children ?? []) walkComponent(child);
            };
            walkComponent(result.screen.root);

            let visualNodeCount = 0;
            const walkVisual = (node: typeof result.graph.root): void => {
              visualNodeCount += 1;
              for (const child of node.children) walkVisual(child);
            };
            walkVisual(result.graph.root);

            const directChildren = result.screen.root.children ?? [];
            const highlights = result.candidates.filter((candidate) =>
              ['RadioGroup', 'Button', 'Card', 'MissingElement'].includes(candidate.componentName),
            );

            console.log(
              JSON.stringify(
                {
                  releases: { utility: '0.5.1', zora: '4.4.1' },
                  componentCatalogCount: components.length,
                  unresolvedComponentName,
                  confidence: result.confidence,
                  visualRootChildCount: result.graph.root.children.length,
                  visualNodeCount,
                  directChildCount: directChildren.length,
                  directChildTypes: directChildren.map((child) => child.type),
                  componentCounts,
                  candidateCount: result.candidates.length,
                  candidateHighlights: highlights,
                  diagnosticCount: result.diagnostics.length,
                  diagnostics: result.diagnostics,
                },
                null,
                2,
              ),
            );
          } finally {
            await ocr.terminateAsync?.();
          }
          TS
          bun direct-image-acceptance.ts
