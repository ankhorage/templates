name: SharkPrey image to ZORA PR heads

on:
  push:
    branches:
      - test/sharkprey-image-zora-pr-heads

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Templates
        uses: actions/checkout@v4
        with:
          path: templates

      - name: Checkout Utility recognition branch
        uses: actions/checkout@v4
        with:
          repository: ankhorage/utility
          ref: fix/63-screen-recognition-overmatching
          path: utility

      - name: Checkout ZORA owner branch
        uses: actions/checkout@v4
        with:
          repository: ankhorage/zora
          ref: fix/395-radio-group-container-reachability
          path: zora

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Pack Utility and ZORA candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/packages"
          cd "$GITHUB_WORKSPACE/utility"
          bun install --frozen-lockfile
          npm pack --silent --pack-destination "$GITHUB_WORKSPACE/packages"
          cd "$GITHUB_WORKSPACE/zora"
          bun install --frozen-lockfile
          npm pack --silent --pack-destination "$GITHUB_WORKSPACE/packages"

      - name: Install public candidate boundaries and OCR engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/acceptance/tessdata"
          cd "$GITHUB_WORKSPACE/acceptance"
          UTILITY_TARBALL="$(find "$GITHUB_WORKSPACE/packages" -name 'ankhorage-utility-*.tgz' -print -quit)"
          ZORA_TARBALL="$(find "$GITHUB_WORKSPACE/packages" -name 'ankhorage-zora-*.tgz' -print -quit)"
          cat > package.json <<EOF
          {
            "type": "module",
            "dependencies": {
              "@ankhorage/utility": "file:${UTILITY_TARBALL}",
              "@ankhorage/zora": "file:${ZORA_TARBALL}",
              "@techstark/opencv-js": "5.0.0-release.1",
              "sharp": "0.35.4",
              "tesseract.js": "7.0.0"
            }
          }
          EOF
          bun install
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata \
            --output tessdata/eng.traineddata
          gzip -c tessdata/eng.traineddata > tessdata/eng.traineddata.gz

      - name: Analyze original SharkPrey onboarding screen
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/acceptance"
          cat > analyze.ts <<'EOF'
          import {
            analyzeScreenImageAsync,
            createTesseractScreenOcrAsync,
          } from '@ankhorage/utility/image';
          import { ZORA_COMPONENT_META } from '@ankhorage/zora/metadata';

          const components = Object.values(ZORA_COMPONENT_META);
          const unresolvedComponentName = components.find(
            (component) => component.manifestPolicy?.kind === 'unresolved-element',
          )?.name;
          const ocr = await createTesseractScreenOcrAsync({
            langPath: `${process.cwd()}/tessdata`,
            language: 'eng',
          });

          let result;
          try {
            result = await analyzeScreenImageAsync(
              `${process.env.GITHUB_WORKSPACE}/templates/src/templates/categories/education-learning/sharkprey/assets/screens/02-onboarding.png`,
              {
                screen: { id: 'onboarding', name: 'Onboarding', title: 'Onboarding' },
                components,
                minConfidence: 0.42,
                ...(unresolvedComponentName ? { unresolvedComponentName } : {}),
                ocr,
              },
            );
          } finally {
            await ocr.terminateAsync?.();
          }

          const counts = {};
          const visit = (node) => {
            counts[node.type] = (counts[node.type] ?? 0) + 1;
            node.children?.forEach(visit);
          };
          visit(result.screen.root);

          console.log(
            JSON.stringify(
              {
                confidence: result.confidence,
                graphRootChildren: result.graph.root.children.length,
                counts,
                diagnostics: result.diagnostics,
                root: result.screen.root,
              },
              null,
              2,
            ),
          );

          if (result.screen.root.type !== 'Screen') {
            throw new Error(`Expected Screen root, received ${result.screen.root.type}.`);
          }
          if ((counts.Button ?? 0) > 5) {
            throw new Error(`Interactive overmatching remains: ${counts.Button} Button nodes.`);
          }
          if ((counts.RadioGroup ?? 0) !== 1) {
            throw new Error(`Expected one owner RadioGroup, received ${counts.RadioGroup ?? 0}.`);
          }
          EOF
          bun analyze.ts
