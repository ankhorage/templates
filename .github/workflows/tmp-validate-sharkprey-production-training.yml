name: Validate SharkPrey production training binding

on:
  push:
    branches:
      - feat/sharkprey-production-training-binding

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sharkprey-production-training-binding
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Fix generated binding patch and strict tests
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest_path = Path('src/templates/categories/education-learning/sharkprey/createAppManifest.ts')
          source = manifest_path.read_text()
          replacements = {
              "    'decision-poker-table': {    'decision-poker-table': {": "    'decision-poker-table': {",
              "    'decision-table': {    'decision-table': {": "    'decision-table': {",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Missing expected duplicate marker: {old}')
              source = source.replace(old, new, 1)
          manifest_path.write_text(source)

          test_path = Path('test/sharkprey-api.test.ts')
          test_source = test_path.read_text()
          if test_source.count('.props.options') != 3:
              raise SystemExit('Expected exactly three strict props.options accesses.')
          test_source = test_source.replace('.props.options', '.props?.options')
          test_source = test_source.replace(
              "  const gameEvent = requireEvents(requireBinding(manifest, 'setup-game'), 'valueChange')[0];\n"
              "  const tableEvent = requireEvents(requireBinding(manifest, 'setup-table'), 'valueChange')[0];\n"
              "  const streetEvent = requireEvents(requireBinding(manifest, 'setup-street'), 'valueChange')[0];",
              "  const [gameEvent] = requireEvents(requireBinding(manifest, 'setup-game'), 'valueChange');\n"
              "  const [tableEvent] = requireEvents(requireBinding(manifest, 'setup-table'), 'valueChange');\n"
              "  const [streetEvent] = requireEvents(requireBinding(manifest, 'setup-street'), 'valueChange');",
          )
          test_path.write_text(test_source)
          PY
      - run: bun install --frozen-lockfile
      - run: bun x ankhorage-prettier --write test/sharkprey-api.test.ts src/templates/categories/education-learning/sharkprey/createAppManifest.ts
      - run: bun test test/sharkprey-api.test.ts
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run format:check
      - run: bun run docs
      - run: bun run changeset:status
      - name: Smoke selected production hand
        run: |
          set -euo pipefail
          list="$(curl --fail-with-body --silent --show-error 'https://api.ankhorage.com/v1/poker/training/tasks?gameCategory=cash&tableSize=6max&street=flop&difficulty=3&limit=1')"
          task_id="$(echo "$list" | jq -er '.[0].id')"
          detail="$(curl --fail-with-body --silent --show-error "https://api.ankhorage.com/v1/poker/training/tasks/$task_id")"
          echo "$detail" | jq -e '.task.tableSize == "6max" and .task.gameCategory == "cash" and .task.street == "flop" and .task.difficulty == 3 and (.task.heroCards | length == 2) and (.task.players | length == 6) and (.options | length > 1)' >/dev/null
          echo "$detail" | jq '{id:.task.id,slug:.task.slug,gameCategory:.task.gameCategory,tableSize:.task.tableSize,street:.task.street,difficulty:.task.difficulty,heroPosition:.task.heroPosition,heroCards:.task.heroCards,communityCards:.task.communityCards,pot:.task.pot,historyText:.task.historyText,prompt:.task.prompt,options:[.options[].label]}'
      - name: Commit validated binding and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/categories/education-learning/sharkprey/createAppManifest.ts test/sharkprey-api.test.ts
          git rm .github/workflows/tmp-validate-sharkprey-production-training.yml
          git commit -m "chore: complete SharkPrey production binding validation"
          git push origin HEAD:feat/sharkprey-production-training-binding
