name: Fix ADM 5 Nutrition Runtime Shape

on:
  push:
    branches:
      - agent/adm-5-canonical-nutrition-data

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Align bindings with direct generated database results
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceExactly = (path, before, after) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Missing expected fragment in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          };

          const generatedApiPath =
            'src/templates/starter/categories/food-drink/nutrition-catalog-scan/generatedApi.ts';
          let generatedApi = fs.readFileSync(generatedApiPath, 'utf8');
          generatedApi = generatedApi.replace(
            "{ name: 'createdAt', type: 'datetime', required: true }",
            "{ name: 'createdAt', type: 'datetime' }",
          );
          generatedApi = generatedApi.replace(
            "{ name: 'updatedAt', type: 'datetime', required: true }",
            "{ name: 'updatedAt', type: 'datetime' }",
          );
          fs.writeFileSync(generatedApiPath, generatedApi);

          const bindingsPath =
            'src/templates/starter/categories/food-drink/nutrition-catalog-scan/bindings.ts';
          let bindings = fs.readFileSync(bindingsPath, 'utf8');
          const barcodeBlock = `            barcode: {
              kind: 'source',
              source: {
                kind: 'state',
                path: 'forms.products.create.barcode',
              },
              transforms: ['trim'],
            },`;
          if (!bindings.includes(barcodeBlock)) throw new Error('Missing create barcode binding.');
          bindings = bindings.replace(
            barcodeBlock,
            `${barcodeBlock}
            normalizedBarcode: {
              kind: 'source',
              source: {
                kind: 'state',
                path: 'forms.products.create.barcode',
              },
              transforms: ['trim'],
            },`,
          );
          bindings = bindings.replaceAll(
            "operation: productCreateOperation,\n              path: 'product.id'",
            "operation: productCreateOperation,\n              path: 'id'",
          );
          bindings = bindings.replace(/path: 'product\.(?!id)([^']+)'/g, "path: '$1'");
          fs.writeFileSync(bindingsPath, bindings);

          const screensPath =
            'src/templates/starter/categories/food-drink/nutrition-catalog-scan/screens.ts';
          let screens = fs.readFileSync(screensPath, 'utf8');
          const wrappedList = `                operationId: 'products.list',
              },
              path: 'products',`;
          if (!screens.includes(wrappedList)) throw new Error('Missing wrapped product-list path.');
          screens = screens.replace(
            wrappedList,
            `                operationId: 'products.list',
              },`,
          );
          screens = screens.replace("path: 'product.imageRefs'", "path: 'imageRefs'");
          screens = screens.replace(
            'Loaded from the nutrition API using the current route param product ID.',
            'Loaded through the generated product read operation using the current route param ID.',
          );
          screens = screens.replace(
            'Each block reflects one image ref from product.imageRefs.',
            'Each block reflects one image ref from the current product imageRefs field.',
          );
          screens = screens.replace(
            'Prefilled from scan or manual entry; normalized before API calls.',
            'Prefilled from scan or manual entry; normalized before the generated create operation.',
          );
          screens = screens.replace(
            'If POST /products returns 409 with product.id, the generated binding opens the existing product instead of treating the conflict as fatal.',
            'Barcode uniqueness is enforced by the generated database operation; duplicate errors should return the user to lookup instead of inventing an HTTP response contract.',
          );
          screens = screens.replace(
            'The generated app should show inline validation for 400 responses and retry messaging when the backend is unavailable with 503.',
            'The generated app should surface invalid input and database-operation diagnostics without assuming HTTP status codes.',
          );
          fs.writeFileSync(screensPath, screens);

          const testPath = 'test/create-food-drink-nutrition-catalog-scan-template.test.ts';
          let testSource = fs.readFileSync(testPath, 'utf8');
          testSource = testSource.replaceAll(
            `        operationId: 'products.list',
      },
      path: 'products',`,
            `        operationId: 'products.list',
      },`,
          );
          testSource = testSource.replaceAll("path: 'product.imageRefs'", "path: 'imageRefs'");
          testSource = testSource.replaceAll("path: 'product.name'", "path: 'name'");
          testSource = testSource.replaceAll(
            "path: 'product.nutritionFacts.basis'",
            "path: 'nutritionFacts.basis'",
          );
          const createOperation = `operation: {
        dataSourceId: 'nutrition-products',
        endpointId: 'products',
        operationId: 'products.create',
      },
      path: 'product.id',`;
          testSource = testSource.replaceAll(
            createOperation,
            `operation: {
        dataSourceId: 'nutrition-products',
        endpointId: 'products',
        operationId: 'products.create',
      },
      path: 'id',`,
          );
          const packageExpectation = `    expect(createButtonBindings?.events?.press?.[0]?.input?.packageLabel).toEqual({`;
          if (!testSource.includes(packageExpectation)) {
            throw new Error('Missing create package-label expectation.');
          }
          testSource = testSource.replace(
            packageExpectation,
            `    expect(createButtonBindings?.events?.press?.[0]?.input?.normalizedBarcode).toEqual({
      kind: 'source',
      source: {
        kind: 'state',
        path: 'forms.products.create.barcode',
      },
      transforms: ['trim'],
    });
    ${packageExpectation.trimStart()}`,
          );
          fs.writeFileSync(testPath, testSource);

          const domainTestPath = 'test/nutrition-domain-data.test.ts';
          let domainTest = fs.readFileSync(domainTestPath, 'utf8');
          const operationAssertion = `              expect(resource?.operations).toEqual(['list', 'read', 'create', 'update', 'delete']);`;
          if (!domainTest.includes(operationAssertion)) throw new Error('Missing operation assertion.');
          domainTest = domainTest.replace(
            operationAssertion,
            `${operationAssertion}
              expect(resource?.collection.fields.find((field) => field.name === 'createdAt')?.required).not.toBe(true);
              expect(resource?.collection.fields.find((field) => field.name === 'updatedAt')?.required).not.toBe(true);`,
          );
          fs.writeFileSync(domainTestPath, domainTest);

          const docsPath = 'docs/nutrition-catalog-scan-data.md';
          let docs = fs.readFileSync(docsPath, 'utf8');
          docs += '\nGenerated database operations return list arrays and resource records directly. Template bindings therefore use the direct result shape instead of legacy HTTP wrapper paths such as `products` or `product.*`.\n';
          fs.writeFileSync(docsPath, docs);
          NODE

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Knip
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Generate docs
        run: bun run docs

      - name: Final format
        run: bun run format

      - name: Final format check
        run: bun run format:check

      - name: Prepare validated commit
        run: |
          rm .github/workflows/fix-adm5-nutrition-runtime-shape.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align nutrition bindings with generated database results'

      - name: Check changeset
        env:
          CHANGESET_BASE_SHA: origin/main
          CHANGESET_HEAD_SHA: HEAD
        run: |
          if [ -f ./scripts/check-changeset-status.sh ]; then
            bash ./scripts/check-changeset-status.sh
          else
            bunx changeset status --since=origin/main
          fi

      - name: Push validated fix
        run: git push origin HEAD:agent/adm-5-canonical-nutrition-data
