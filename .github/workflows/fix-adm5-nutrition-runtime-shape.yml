name: Fix ADM 5 Nutrition Runtime Shape

on:
  push:
    branches:
      - agent/adm-5-canonical-nutrition-data

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Apply guarded runtime-shape corrections
        run: node .adm5-fix-nutrition-runtime-shape.js
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run format
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Knip
        run: bun run knip
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Generate docs
        run: bun run docs
      - name: Final format
        run: bun run format
      - name: Final format check
        run: bun run format:check
      - name: Prepare validated commit
        run: |
          rm .adm5-fix-nutrition-runtime-shape.js
          rm .github/workflows/fix-adm5-nutrition-runtime-shape.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align nutrition bindings with generated database results'
      - name: Check changeset
        env:
          CHANGESET_BASE_SHA: origin/main
          CHANGESET_HEAD_SHA: HEAD
        run: |
          if [ -f ./scripts/check-changeset-status.sh ]; then
            bash ./scripts/check-changeset-status.sh
          else
            bunx changeset status --since=origin/main
          fi
      - name: Push validated fix
        run: git push origin HEAD:agent/adm-5-canonical-nutrition-data
