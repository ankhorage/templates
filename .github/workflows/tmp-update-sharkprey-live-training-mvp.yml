name: Update SharkPrey live training MVP

on:
  push:
    branches:
      - fix/sharkprey-live-training-mvp

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sharkprey-live-training-mvp
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/tmp-update-sharkprey-live-training-mvp.ts
      - run: bun scripts/tmp-fix-sharkprey-live-training-test.ts
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run test
      - run: bun run changeset:status
      - run: bun run format
      - name: Commit verified MVP update and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-update-sharkprey-live-training-mvp.yml scripts/tmp-update-sharkprey-live-training-mvp.ts scripts/tmp-fix-sharkprey-live-training-test.ts
          git add -A
          git commit -m "fix: align SharkPrey with live poker training API"
          git push origin HEAD:fix/sharkprey-live-training-mvp
