name: Diagnose Canonical Auth Flow Migration

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'phase1/canonical-auth-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Print migration source counts
        run: |
          python3 <<'PY'
          from pathlib import Path

          checks = [
              ('nutrition authz', 'src/templates/starter/categories/food-drink/nutrition-catalog-scan/template.ts', "        authorization: {\n          kind: 'RBAC',\n          engine: 'native',\n        },\n"),
              ('nutrition settings', 'src/templates/starter/categories/food-drink/nutrition-catalog-scan/template.ts', "    },\n    settings: {\n      ...manifest.settings,\n      authFlow: {\n        signInRoute: 'sign-in',\n        signUpRoute: 'sign-up',\n        signOutRoute: 'sign-out',\n        postSignInRoute: '/products',\n        unauthorizedRoute: 'sign-in',\n      },\n    },\n"),
              ('urban settings', 'src/templates/starter/categories/business-productivity/urban-water-monitor/template.ts', "  return {\n    ...manifest,\n    settings: {\n      ...manifest.settings,\n      authFlow: {\n        ...manifest.settings.authFlow,\n        postSignInRoute: 'index',\n      },\n    },\n  };"),
              ('category assertions', 'test/create-category-app.test.ts', "      expect(manifest.settings.authFlow.signInRoute).toBe('sign-in');\n      expect(manifest.settings.authFlow.signUpRoute).toBe('sign-up');\n      expect(manifest.settings.authFlow.signOutRoute).toBe('sign-out');\n      expect(manifest.settings.authFlow.postSignInRoute).toBe('index');\n      expect(manifest.infra.auth?.scope).toBe('global');"),
              ('oauth import', 'test/oauth-auth-templates.test.ts', "import type { AppManifest, UiNode } from '@ankhorage/contracts';\n"),
              ('oauth sign-in read', 'test/oauth-auth-templates.test.ts', "    const { signInRoute } = manifest.settings.authFlow;"),
              ('oauth disabled reads', 'test/oauth-auth-templates.test.ts', "    expect(manifest.screens[manifest.settings.authFlow.signInRoute]).toBeUndefined();"),
              ('nutrition expected authz', 'test/create-food-drink-nutrition-catalog-scan-template.test.ts', "      authorization: {\n        kind: 'RBAC',\n        engine: 'native',\n      },\n"),
              ('nutrition settings assertions', 'test/create-food-drink-nutrition-catalog-scan-template.test.ts', "    expect(manifest.settings.authFlow.postSignInRoute).toBe('/products');\n    expect(manifest.settings.authFlow.postSignInRoute).not.toContain('products/products');"),
              ('urban assertion', 'test/create-business-productivity-urban-water-monitor-template.test.ts', "    expect(manifest.settings.authFlow.postSignInRoute).toBe('index');"),
              ('readme canonical paragraph', 'README.md', "Auth behavior is not modeled as a visible navigation route in category templates. It remains\ncontrolled by the manifest `infra` and `settings.authFlow` configuration. The original generic\nstarter remains available as the fallback template and preserves its existing sign-in screen."),
              ('readme nutrition paragraph', 'README.md', "- `food_drink/nutrition-catalog-scan`: Products · Scan · Stats · Profile. This restricted product\n  barcode nutrition scanner starter uses `infra.auth.scope = \"global\"`, Supabase auth, native\n  RBAC, and an app-facing `profiles` table. Generated apps should keep identity in Supabase Auth,"),
          ]
          for label, path, needle in checks:
              print(f'{label}: {Path(path).read_text().count(needle)}')
          PY
